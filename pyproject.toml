[project]
name = "multi-annotator-toolkit"
version = "0.6.0"
description = "Annotator UI, auto-labeling review, and KαLOS consensus analysis built on FiftyOne."
readme = "README.md"
authors = [
    { name = "David Tschirschwitz", email = "david.tschirschwitz@uni-weimar.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fiftyone>=1.22.0",
    "kalos>=0.8.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mat-load-coco = "multi_annotator_toolkit.cli:load_coco_main"
mat-analyze = "multi_annotator_toolkit.cli:analyze_main"
mat-demo = "multi_annotator_toolkit.cli:demo_main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
